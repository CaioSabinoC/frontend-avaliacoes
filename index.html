<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#dc2626" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
  <title>Avaliações - Pizza da Toca</title>
</head>

<body class="bg-light">
  <div class="container py-4">
    
    <header class="text-center mb-4">
      <img src="icons/logo.png" alt="Pizza da Toca" class="logo mb-3" />
      <h1 class="mb-1">Pizza da Toca</h1>
      <p class="subtitle">Avaliações dos nossos clientes</p>
    </header>

    <section class="card shadow-sm mb-4">
      <div class="card-body">
        <h2 id="form-title" class="h4 mb-3">Nova avaliação</h2>

        <form id="entry-form">
          <input type="hidden" id="entry-id" />

          <!-- CORRIGIDO: id="name" → id="nome" -->
          <div class="mb-3">
            <label for="nome" class="form-label">Nome do cliente</label>
            <input type="text" id="nome" class="form-control" required />
          </div>

          <!-- CORRIGIDO: id="title" → id="titulo" -->
          <div class="mb-3">
            <label for="titulo" class="form-label">Título da avaliação</label>
            <input type="text" id="titulo" class="form-control" required />
          </div>

          <!-- CORRIGIDO: id="description" → id="descricao" -->
          <div class="mb-3">
            <label for="descricao" class="form-label">Comentário</label>
            <textarea id="descricao" rows="4" class="form-control" required></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label">Avaliação</label>
            <!-- CORRIGIDO: spans em ordem reversa + CSS row-reverse para preencher da esquerda pra direita -->
            <div id="star-rating" class="star-rating">
              <span data-value="5">★</span>
              <span data-value="4">★</span>
              <span data-value="3">★</span>
              <span data-value="2">★</span>
              <span data-value="1">★</span>
            </div>
            <input type="hidden" id="estrelas" />
          </div>

          <div class="mb-3">
            <label for="happenedAt" class="form-label">Data e hora</label>
            <input type="datetime-local" id="happenedAt" class="form-control" required />
          </div>

          <div class="d-flex gap-2 flex-wrap">
            <button type="submit" class="btn btn-danger">Salvar avaliação</button>
            <button type="button" id="cancel-edit" class="btn btn-secondary hidden">Cancelar edição</button>
          </div>
        </form>

        <p id="message" class="mt-3 mb-0"></p>
      </div>
    </section>

    <section class="card shadow-sm">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
          <h2 class="h4 mb-0">Avaliações dos clientes</h2>
          <button id="reload-btn" class="btn btn-outline-secondary">Atualizar</button>
        </div>

        <div id="entries-list"></div>
      </div>
    </section>

  </div>

  <script src="app.js"></script>
</body>
</html>
